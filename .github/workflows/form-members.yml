name: 同步表單成員
on:
  schedule:
    - cron: "7 * * * *"   # 每小時一次
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/form_members.py
      - run: |
          if [ -n "$(git status --porcelain form-members.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add form-members.json
            git commit -m "更新表單成員"
            git push
          fi
