<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打卡網站</title>
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#2b2622; --muted:#7a7068; --line:#e8e1d8;
  --accent:#b5651d; --ok:#2e7d4f; --ok-bg:#e3f2e8; --bad:#c0392b; --bad-bg:#fbe5e2;
  --free:#6b5fb5; --free-bg:#ece9f8; --late:#b7791f; --late-bg:#fdf1dc; --none-bg:#f3efe9;
  --cov:#3d7ea6; --cov-bg:#e2eff6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1916; --card:#262220; --ink:#f0ebe5; --muted:#a59a90; --line:#3a3430;
    --accent:#e0954f; --ok:#6fcf97; --ok-bg:#1f3a2a; --bad:#ff8a7a; --bad-bg:#4a2420;
    --free:#b3a8f0; --free-bg:#302b4a; --late:#f0c060; --late-bg:#45381c; --none-bg:#2e2a27;
    --cov:#8cc4e6; --cov-bg:#1d3442;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1916; --card:#262220; --ink:#f0ebe5; --muted:#a59a90; --line:#3a3430;
  --accent:#e0954f; --ok:#6fcf97; --ok-bg:#1f3a2a; --bad:#ff8a7a; --bad-bg:#4a2420;
  --free:#b3a8f0; --free-bg:#302b4a; --late:#f0c060; --late-bg:#45381c; --none-bg:#2e2a27;
  --cov:#8cc4e6; --cov-bg:#1d3442;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button:disabled{opacity:.6;cursor:default}
select,input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:120px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .k{color:var(--muted);font-size:.85rem}
.stat .v{font-size:1.6rem;font-weight:700}
.stat .v.money{color:var(--bad)}
.banner{padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:.92rem}
.banner.info{background:var(--free-bg);color:var(--free)}
.banner.err{background:var(--bad-bg);color:var(--bad)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.85rem}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.money{color:var(--bad);font-weight:700}
td.zero{color:var(--ok);font-weight:700}
.grid th,.grid td{padding:3px;text-align:center;border:0}
.grid th.name,.grid td.name{text-align:left;padding-right:10px;position:sticky;left:0;background:var(--card);z-index:1}
.c{display:inline-block;width:26px;height:26px;line-height:26px;border-radius:6px;font-size:.78rem;font-weight:700;font-style:normal;text-align:center}
.c.ok{background:var(--ok-bg);color:var(--ok)}
.c.miss{background:var(--bad-bg);color:var(--bad)}
.c.late{background:var(--late-bg);color:var(--late)}
.c.cov{background:var(--cov-bg);color:var(--cov)}
.c.free{background:var(--free-bg);color:var(--free)}
.c.na{background:var(--none-bg);color:var(--muted);opacity:.6;border:1px solid var(--line)}
.c.now{background:var(--none-bg);color:var(--accent);outline:1px dashed var(--accent);outline-offset:-1px}
.c.nodata{background:var(--none-bg);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.85rem;color:var(--muted);margin-top:12px;align-items:center}
.legend > span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend .c{width:22px;height:22px;line-height:22px;font-size:.72rem;flex:none}
.month-note{margin:-4px 0 12px}
a{color:var(--accent)}
.tabs{display:flex;gap:4px;margin:0 0 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;padding-top:6px}
.tabs button{background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;border-radius:0;padding:10px 16px;font-weight:600;flex:1;max-width:160px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
[hidden]{display:none !important}
.report-btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:700;width:100%;margin-top:14px;font-size:1.05rem}
.rform{max-width:520px;margin:0 auto}
.rform input,.rform select{width:100%;font-size:1rem}
.rform input[type=date]{display:block;max-width:100%;min-height:42px}
@supports (-webkit-touch-callout: none){input[type=date],input[type=month],input[type=time]{-webkit-appearance:none;appearance:none;line-height:24px;text-align:left;-webkit-min-logical-width:calc(100% - 22px);min-height:42px}}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.row2 > div,.field{min-width:0}
.field{margin-top:14px}
.field label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.hint{color:var(--muted);font-size:.85rem;margin:4px 0 0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--none-bg);border-radius:10px;padding:4px}
.seg button{background:transparent;color:var(--muted);border:0;border-radius:8px;padding:9px 4px;font-weight:600}
.seg button[aria-selected="true"]{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.names button{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 4px;font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.names button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.names button.new{grid-column:1/-1;color:var(--muted);font-weight:500;border-style:dashed}
.names button.new[aria-pressed="true"]{color:#fff}
#reportNew{margin-top:8px}
.rlist{margin:0;padding:0;list-style:none}
.rlist li{padding:8px 0;border-top:1px solid var(--line)}
.rlist li:first-child{border-top:0}
.rlist b{display:block}
.mine{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.mine span{text-align:center;font-size:.75rem;color:var(--muted)}
.msg{margin:10px 0 0}
.msg.ok{color:var(--ok);font-weight:600}
.msg.err{color:var(--bad);font-weight:600}
body.on-report .toolbar{display:none}
.rules{font-size:.9rem;color:var(--muted);margin:0;padding-left:20px}
h2{font-size:1.1rem;margin:0 0 12px}
/* 管理頁 */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chips button{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.chips button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.admin-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.admin-head .spacer{flex:1}
table.edit td{padding:4px;border:0}
table.edit th{padding:4px}
table.edit input{width:100%;min-width:110px}
table.edit input:disabled{background:transparent;border-color:transparent;color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1}
.row-act{white-space:nowrap}
button.sm{padding:4px 9px;font-size:.85rem}
.edit-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:4px 16px}
.form-grid input,.form-grid textarea{width:100%}
.form-grid .wide{grid-column:1/-1}
.glist{display:grid;gap:10px}
.gitem{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.gitem b{font-size:1.05rem}
.copy{display:flex;gap:6px;margin-top:6px}
.copy input{flex:1}
@media (max-width: 700px){
  .wrap{padding:16px 10px 40px}
  h1{font-size:1.3rem}
  .sub{font-size:.82rem;margin-bottom:12px}
  .card{padding:12px;border-radius:12px}
  .tabs{gap:0}
  .tabs button{padding:10px 2px;font-size:.88rem;white-space:nowrap;min-width:0}
  .stats{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{padding:10px}
  .stat .v{font-size:1.15rem}
  .stat .k{font-size:.72rem}
  .scroll.tall{max-height:72vh;overflow:auto;margin:0 -12px;padding:0 12px 0 0}
  .scroll.tall tr:first-child th{position:sticky;top:0;background:var(--card);z-index:2}
  .scroll.tall tr:first-child th:first-child{left:0;z-index:3}
  #summaryTable td:first-child,#summaryTable th:first-child{position:sticky;left:0;background:var(--card);z-index:1}
  #summaryTable th,#summaryTable td{padding:7px 8px}
  .grid th.name,.grid td.name{padding-left:12px}
  .grid th{font-size:.75rem;line-height:1.2}
  .c{width:24px;height:24px;line-height:24px;font-size:.72rem}
}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">打卡網站</h1>
  <p class="sub" id="subtitle"></p>

  <div id="banner"></div>

  <!-- ===== 群組頁 ===== -->
  <div id="groupView" hidden>
  <div class="card toolbar">
    <label for="month">月份</label>
    <select id="month"></select>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="report">回報專區</button>
    <button role="tab" data-tab="daily">回報紀錄</button>
    <button role="tab" data-tab="summary">本月結算</button>
    <button role="tab" data-tab="admin">管理</button>
  </nav>

  <section class="panel" data-panel="report" hidden>
  <form class="card rform" id="reportForm" novalidate autocomplete="off">
    <div class="seg" id="kindSeg">
      <button type="button" data-kind="daily">每日回報</button>
      <button type="button" data-kind="class" id="kindClass">請假回報</button>
    </div>
    <div class="field">
      <span class="lbl">名字</span>
      <div class="names" id="nameButtons"></div>
      <input id="reportNew" placeholder="輸入你的名字" maxlength="20" hidden>
    </div>
    <div data-kind-panel="class" hidden>
      <div class="field row2">
        <div><label for="classFrom" id="classFromLbl">第一天</label><input type="date" id="classFrom"></div>
        <div><label for="classTo" id="classToLbl">最後一天</label><input type="date" id="classTo"></div>
      </div>
    </div>
    <p class="hint" id="reportHint"></p>
    <button type="submit" class="report-btn" id="reportBtn">已完成 ✅ 送出回報</button>
    <p class="hint msg" id="reportMsg"></p>
    <div id="reportMine"></div>
  </form>
  <div class="card rform" id="reportList" hidden></div>
  <p class="hint" style="text-align:center"><a href="#daily">查看大家的回報狀況 →</a></p>
  </section>

  <section class="panel" data-panel="daily" hidden>
  <div class="card" id="rulesCard">
    <h2>規則</h2>
    <ol class="rules" id="rulesList"></ol>
  </div>
  <div class="card">
    <h2>回報紀錄</h2>
    <p class="hint month-note" hidden></p>
    <div class="scroll tall"><table class="grid" id="grid"></table></div>
    <div class="legend" id="legend"></div>
  </div>
  </section>

  <section class="panel" data-panel="summary" hidden>
  <div class="stats" id="stats"></div>
  <div class="card" style="margin-top:16px">
    <h2>本月結算</h2>
    <p class="hint month-note" hidden></p>
    <div class="scroll tall"><table id="summaryTable"></table></div>
  </div>
  </section>

  <section class="panel" data-panel="admin" hidden>
    <div id="adminPanel" hidden>
      <div class="card admin-head">
        <span>已登入：<b id="adminEmail"></b></span><span class="spacer"></span>
        <button type="button" class="ghost sm" id="logoutBtn">登出</button>
      </div>
      <div class="chips" id="adminChips"></div>
      <div class="card" id="adminSec"></div>
    </div>
  </section>
  </div>

  <!-- ===== 總管理（?admin） ===== -->
  <div id="ownerView" hidden>
    <div id="ownerPanel" hidden>
      <div class="card admin-head">
        <span>總管理：<b id="ownerEmail"></b></span><span class="spacer"></span>
        <button type="button" class="ghost sm" id="ownerLogout">登出</button>
      </div>
      <div class="card">
        <h2>建立新群組</h2>
        <div class="form-grid">
          <div class="field"><label for="newName">群組名稱</label><input id="newName" placeholder="例如：讀書會打卡"></div>
          <div class="field"><label for="newAdmins">負責人 Email（可以多個，用逗號分開）</label><input id="newAdmins" placeholder="a@gmail.com, b@gmail.com"></div>
        </div>
        <button type="button" id="createBtn" style="margin-top:14px">建立群組</button>
        <p class="hint msg" id="createMsg"></p>
      </div>
      <div class="card">
        <h2>所有群組</h2>
        <div class="glist" id="groupList"></div>
      </div>
    </div>
  </div>

  <!-- 登入（管理頁和總管理共用） -->
  <div class="card rform" id="loginCard" hidden>
    <h2>管理登入</h2>
    <p class="hint">只有管理員可以修改。輸入管理員名單上的 Email 就能登入。</p>
    <div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="email" inputmode="email"></div>
    <button type="button" class="report-btn" id="loginBtn">登入</button>
    <p class="hint msg" id="loginMsg"></p>
  </div>
  <datalist id="memberNames"></datalist>
</div>

<script>
/* ===== 後端（Google Apps Script）網址：所有群組共用 ===== */
const API = "https://script.google.com/macros/s/AKfycbyhKffbfndynk44KL4EypMjVBto1OhvOBnQy0zS2li_nmtzwrk8aXaMGAwYUfjCosZo/exec";
const PARAMS = new URLSearchParams(location.search);
const G = PARAMS.get("g") || "xinzhi";       // 群組代碼（沒帶的話是心之使者，舊網址照樣能用）
const OWNER_MODE = PARAMS.has("admin");      // 總管理頁

const $ = id => document.getElementById(id);
const GRACE_MS = 60 * 1000;   // 切換時間後 59 秒內都還算前一天
const pad = n => String(n).padStart(2, "0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return key(d); };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const md = d => `${+d.slice(5, 7)}/${+d.slice(8)}`;
const wkOf = d => "日一二三四五六"[fromKey(d).getDay()];
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} },
};

let DATA = null, SETTINGS = {}, MODEL = null, ROWS = [];

/* ---------- 每天的切換時間（預設中午 12:00） ---------- */
function cutMs() {
  const m = String(SETTINGS.cutoff || "12:00").match(/(\d{1,2}):(\d{2})/);
  return m ? (+m[1] * 60 + +m[2]) * 60e3 : 12 * 3600e3;
}
const dayOf = t => key(new Date(t - cutMs() - GRACE_MS));                       // 這個時間點的回報算哪一天
const deadlineOf = d => fromKey(addDays(d, 1)).getTime() + cutMs() + GRACE_MS;  // 那一天最晚幾點前要回報
const nowDay = () => dayOf(Date.now());
function cutLabel() {
  const m = String(SETTINGS.cutoff || "12:00").match(/(\d{1,2}):(\d{2})/) || [, "12", "00"];
  const h = +m[1];
  if (h === 12 && m[2] === "00") return "中午 12:00";
  if (h === 0 && m[2] === "00") return "午夜 12:00";
  return `${h < 12 ? "上午" : "下午"} ${h % 12 || 12}:${m[2]}`;
}

// 支援 "2026/11/3 下午 1:23:45"、"2026-11-03 13:23"、"11/3/2026 1:23:45 PM"
function parseDateTime(s) {
  if (!s) return null;
  s = String(s).trim();
  let y, mo, d, rest, m;
  if ((m = s.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})日?(.*)$/))) [, y, mo, d, rest] = m;
  else if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(.*)$/))) [, mo, d, y, rest] = m;
  else return null;
  let h = 0, mi = 0, se = 0;
  const t = rest.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (t) {
    h = +t[1]; mi = +t[2]; se = +(t[3] || 0);
    const pm = /下午|PM|晚上|中午/i.test(rest), am = /上午|AM|早上|凌晨/i.test(rest);
    if (pm && h < 12) h += 12;
    if (am && h === 12) h = 0;
  }
  return new Date(+y, +mo - 1, +d, h, mi, se);
}
function normDate(s) { const p = parseDateTime(s); return p ? key(p) : ""; }
function normMonth(s) { const m = String(s || "").match(/(\d{4})\D+(\d{1,2})/); return m ? `${m[1]}-${pad(m[2])}` : ""; }

/* ---------- 讀資料 ---------- */
const lines = rows => (rows || []).map(r => r.map(x => String(x).replace(/[,，\t\n]/g, " ")).join(",")).join("\n");
function parseLines(text) {
  return (text || "").split(/\n/).map(l => l.split(",").map(x => x.trim())).filter(p => p[0]);
}
function readSettings(d) {
  const s = d.settings || {}, int = (v, def) => { const n = parseInt(v, 10); return isNaN(n) ? def : n; };
  return {
    title: s["名稱"] || "打卡網站", subtitle: s["副標題"] || "", task: s["任務名稱"] || "任務", fineName: s["罰款名稱"] || "罰款",
    startDate: s["開始計算日"] || "", fine: int(s["每次罰款"], 0), freePerMonth: int(s["每月免死次數"], 0), freeFrom: s["免死從"] || "",
    cutoff: s["切換時間"] || "12:00", exName: (s["免除名稱"] || "").trim(), exBefore: int(s["免除提前天數"], 0), rules: s["規則說明"] || "",
    keepMonths: int(s["保留月數"], 0),
    members: lines(d["成員"]), exemptions: lines(d["免除"]), pauses: lines(d["退出休息"]), overrides: lines(d["手算調整"]),
  };
}

/* ---------- 換算每筆回報 ---------- */
function toRecords(rows) {
  const recs = [];
  for (const r of rows) {
    const raw = String(r[1] || "").trim(), ts = parseDateTime(r[0]);
    if (!raw || !ts) continue;
    const tag = (raw.match(/[（(](.*)$/) || [])[1] || "";   // 舊表單的「(重複)」「(練習)」「(遲交)」，括號沒打完整也算
    if (/重複|練習/.test(tag)) continue;
    const name = raw.replace(/\s*[（(].*$/, "").trim();
    let day = dayOf(ts.getTime()), late = false;
    const claimed = normDate(r[2]);
    if (/遲交/.test(tag)) { day = addDays(day, -1); late = true; }
    else if (claimed) {
      day = claimed;
      late = !/補登/.test(r[3] || "") && ts.getTime() > deadlineOf(day);   // 管理員補登的不算遲交
    }
    recs.push({ name, day, late, dated: !!claimed, ts: ts.getTime() });
  }
  return recs;
}

/* ---------- 建立計算模型 ---------- */
function build(recs, s) {
  const current = nowDay();                // 目前還在進行中的那一天
  const start = normDate(s.startDate);

  // 同一人兩次送出相隔不到 1 小時 → 當成不小心送了兩次（只看舊表單的紀錄；網站回報有自己的日期）
  const lastTs = {};
  recs = recs.slice().sort((a, b) => a.ts - b.ts).filter(r => {
    const dup = !r.dated && lastTs[r.name] && r.ts - lastTs[r.name] < 3600e3;
    lastTs[r.name] = r.ts;
    return !dup;
  });
  const byName = {};
  for (const r of recs) {
    const p = byName[r.name] ||= { days: {}, first: r.day };
    if (r.day < p.first) p.first = r.day;
    const prev = p.days[r.day];
    if (!prev || (prev === "late" && !r.late)) p.days[r.day] = r.late ? "late" : "ok";
  }

  // 成員可以寫好幾行：名字,加入日期,結束日期 → 每行是一段計算期間
  const byMember = new Map();
  for (const [n, j, e] of parseLines(s.members)) {
    if (!byMember.has(n)) byMember.set(n, { name: n, periods: [] });
    byMember.get(n).periods.push({ from: normDate(j), to: normDate(e) });
  }
  const members = [...byMember.values()];
  // 沒填加入日期的人，從第一次回報那天開始算；從來沒回報過的先不計算
  for (const m of members) for (const p of m.periods) if (!p.from && byName[m.name]) p.from = byName[m.name].first;
  const never = members.filter(m => m.periods.every(p => !p.from) && !byName[m.name]).map(m => m.name);
  for (const m of members) if (never.includes(m.name)) m.periods = [{ from: "9999-12-31", to: "" }];
  // 回報出現新名字 → 自動加成成員
  const listed = new Set(members.map(m => m.name));
  for (const n of Object.keys(byName)) if (!listed.has(n)) members.push({ name: n, periods: [{ from: byName[n].first, to: "" }], auto: true });
  for (const m of members) m.join = m.periods.map(p => p.from).sort()[0] || "";

  // 舊表單紀錄裡某天幾乎沒人回報 → 那段資料被刪掉了，標成「沒有資料」（網站回報開始之後不適用）
  const perDay = {};
  for (const r of recs) perDay[r.day] = (perDay[r.day] || 0) + 1;
  const webStart = recs.filter(r => r.dated).map(r => r.day).sort()[0] || current;
  const hasHistory = recs.some(r => !r.dated);
  const minPerDay = Math.max(3, Math.round(members.length * 0.25));
  const noData = day => hasHistory && day < webStart && (perDay[day] || 0) < minPerDay;

  const ex = parseLines(s.exemptions).map(([n, a, b]) => {
    const st = normDate(a), en = normDate(b) || st;
    return st ? { name: n, from: addDays(st, -s.exBefore), to: en } : null;
  }).filter(Boolean);

  // 退出／休息：不計算開始日起，到回歸日期前一天（沒寫回歸日期 → 一直不計算）
  const pauses = parseLines(s.pauses).map(([name, a, b, why]) => ({ name, from: normDate(a), back: normDate(b), why: why || "" }))
    .filter(p => p.from);

  let firstDay = start || recs.map(r => r.day).sort()[0] || current;
  // 資料只保留最近 N 個月：更早的月份不顯示
  if (s.keepMonths > 0) {
    const k = fromKey(current.slice(0, 8) + "01");
    k.setMonth(k.getMonth() - (s.keepMonths - 1));
    if (key(k) > firstDay) firstDay = key(k);
  }
  function status(m, day) {
    if (day < firstDay) return "na";
    if (!m.periods.some(p => (!p.from || day >= p.from) && (!p.to || day <= p.to))) return "na";
    if (pauses.some(p => p.name === m.name && day >= p.from && (!p.back || day < p.back))) return "na";
    // 免除期間一律算免（有沒有回報都一樣），還沒到的日子也先標出來
    if (ex.some(e => (e.name === "全部" || e.name === m.name) && day >= e.from && day <= e.to)) return "free";
    if (day > current) return "na";
    const got = byName[m.name]?.days[day];
    if (got === "ok") return "ok";
    if (day === current) return "now";
    if (noData(day)) return "nodata";
    return got === "late" ? "late" : "miss";
  }

  const months = [];
  for (let d = fromKey(firstDay.slice(0, 8) + "01"); key(d) <= current; d.setMonth(d.getMonth() + 1))
    months.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`);
  if (!months.length) months.push(current.slice(0, 7));

  // 在某天以前就已經退出（沒寫回歸日期的退出，或成員期間已結束）
  function exitedBefore(m, day) {
    if (pauses.some(p => p.name === m.name && !p.back && p.from <= day)) return true;
    const last = m.periods[m.periods.length - 1];
    return !!(last && last.to && last.to < day);
  }
  return { members, status, months, never, pauses, exitedBefore, byName, current };
}

function monthDays(ym) {
  const [y, m] = ym.split("-").map(Number);
  return Array.from({ length: new Date(y, m, 0).getDate() }, (_, i) => `${ym}-${pad(i + 1)}`);
}

// 依日期順序計算，每月前 N 次缺交（含遲交）用免死次數抵掉；開始計算日之前不計罰款
function monthDetail(m, ym) {
  const ff = normMonth(SETTINGS.freeFrom);
  const free = ff && ym < ff ? 0 : Math.max(0, SETTINGS.freePerMonth);
  const start = normDate(SETTINGS.startDate);
  const t = { ok: 0, miss: 0, late: 0, free: 0, cov: 0, nodata: 0, billed: 0, cells: [], limit: free };
  for (const d of monthDays(ym)) {
    const st = MODEL.status(m, d);
    const billable = !start || d >= start;
    if (billable && (st === "miss" || st === "late") && t.cov < free) { t.cov++; t.cells.push({ d, st: "cov", was: st }); continue; }
    if (st in t) t[st]++;
    if (billable && (st === "miss" || st === "late")) t.billed++;
    t.cells.push({ d, st });
  }
  t.owe = t.billed * SETTINGS.fine;
  const ov = parseLines(SETTINGS.overrides).find(([n, mo]) => n === m.name && normMonth(mo) === ym);
  if (ov) { t.owe = +String(ov[2]).replace(/[^\d.-]/g, "") || 0; t.manual = true; }
  return t;
}

function render() {
  const ym = $("month").value || MODEL.months[MODEL.months.length - 1];
  const days = monthDays(ym), S = SETTINGS;
  // 退出的人：退出那個月還顯示，下個月起拿掉；整個月都不計算又沒有金額的人不顯示；順序照成員名單
  ROWS = MODEL.members.filter(m => !MODEL.exitedBefore(m, ym + "-01")).map(m => ({ m, t: monthDetail(m, ym) }))
    .filter(r => r.t.owe || r.t.cells.some(c => c.st !== "na"));

  const start = normDate(S.startDate);
  const note = [
    start && days.some(d => d < start) ? `這個月在開始計算日（${md(start)}）之前的日子只顯示回報狀況，不計${S.fineName}。` : "",
    ROWS.some(r => r.t.nodata) ? "灰色「?」的日子沒有回報資料（可能被刪除），不算缺交。" : "",
  ].filter(Boolean).join("<br>");
  document.querySelectorAll(".month-note").forEach(el => { el.innerHTML = note; el.hidden = !note; });

  const sum = ROWS.reduce((a, r) => a + r.t.owe, 0);
  const perfect = ROWS.filter(r => r.t.miss + r.t.late + r.t.cov === 0).length;
  $("stats").innerHTML = [
    [`本月${S.fineName}合計`, `$${sum.toLocaleString()}`, true],
    ["本月全勤人數", `${perfect} / ${ROWS.length}`],
    ["本月回報次數", ROWS.reduce((a, r) => a + r.t.ok, 0)],
  ].map(([k, v, money]) => `<div class="stat"><div class="k">${k}</div><div class="v ${money ? "money" : ""}">${v}</div></div>`).join("");

  const free = S.freePerMonth;
  $("summaryTable").innerHTML = `<tr><th>成員</th><th class="num">已回報</th><th class="num">缺交</th><th class="num">遲交</th>${free ? `<th class="num">已用免死次數</th>` : ""}${S.exName ? `<th class="num">${esc(S.exName)}</th>` : ""}<th class="num">本月${esc(S.fineName)}</th></tr>` +
    ROWS.map(({ m, t }) => {
      const missAll = t.miss + t.cells.filter(c => c.was === "miss").length;
      const lateAll = t.late + t.cells.filter(c => c.was === "late").length;
      return `<tr><td>${esc(m.name)}</td><td class="num">${t.ok}</td><td class="num">${missAll}</td><td class="num">${lateAll}</td>
      ${free ? `<td class="num">${t.limit ? `${t.cov} / ${t.limit}` : "—"}</td>` : ""}${S.exName ? `<td class="num">${t.free}</td>` : ""}
      <td class="num ${t.owe ? "money" : "zero"}">$${t.owe}</td></tr>`;
    }).join("");

  const sym = { ok: "✓", miss: "✗", late: "遲", cov: "抵", free: "免", now: "…", na: "·", nodata: "?" };
  const tip = { ok: "已回報", miss: "缺交", late: "遲交", cov: "用免死次數抵掉", free: `${S.exName}免除`, now: "計算中", na: "不計算", nodata: "沒有資料" };
  $("grid").innerHTML = `<tr><th class="name">成員</th>${days.map(d => `<th>${+d.slice(8)}<br><small>${wkOf(d)}</small></th>`).join("")}</tr>` +
    ROWS.map(({ m, t }) => `<tr><td class="name">${esc(m.name)}</td>${t.cells.map(c =>
      `<td><i class="c ${c.st}" title="${md(c.d)} ${tip[c.st]}${c.was === "late" ? "（遲交）" : ""}">${sym[c.st]}</i></td>`).join("")}</tr>`).join("");
}

async function load() {
  try {
    const res = await fetch(`${API}?g=${encodeURIComponent(G)}&_=${Date.now()}`);
    const d = await res.json();
    if (!d.ok) throw new Error(d.error || "讀不到資料");
    DATA = d;
    SETTINGS = readSettings(d);
    MODEL = build(toRecords(d["回報"] || []), SETTINGS);
  } catch (e) {
    $("banner").innerHTML = `<div class="banner err">${esc(e.message || "讀不到資料，請檢查網路")}</div>`;
    return false;
  }
  const notes = [];
  if (MODEL.never.length) notes.push(`還沒有回報紀錄、也沒填加入日期的成員先不計算：${MODEL.never.map(esc).join("、")}`);
  $("banner").innerHTML = notes.length ? `<div class="banner info">${notes.join("<br>")}</div>` : "";

  const sel = $("month"), keep = sel.value || PARAMS.get("month");
  sel.innerHTML = MODEL.months.slice().reverse().map(m => `<option value="${m}">${m.replace("-", " 年 ")} 月</option>`).join("");
  if (MODEL.months.includes(keep)) sel.value = keep;
  renderStatic();
  render();
  showReport();
  return true;
}

const NEW_NAME = "__new__";
let pickedName = "", reportKind = "daily";

function showReport() {
  const names = MODEL.members.filter(m => !MODEL.exitedBefore(m, MODEL.current)).map(m => m.name);
  // 不記住上一次的名字（大家可能共用同一支手機）；新成員送出後名單會出現他，直接選好

  $("nameButtons").innerHTML = names.map(n => `<button type="button" data-name="${esc(n)}">${esc(n)}</button>`).join("") +
    `<button type="button" class="new" data-name="${NEW_NAME}">＋ 我是新成員</button>`;

function markName() {

}
$("nameButtons").onclick = e => {

function setKind(k) {
  reportKind = k;
  document.querySelectorAll("[data-kind]").forEach(b => b.setAttribute("aria-selected", b.dataset.kind === k));
  document.querySelectorAll("[data-kind-panel]").forEach(p => p.hidden = p.dataset.kindPanel !== k);

["classFrom", "classTo"].forEach(id => $(id).onchange = updateReport);

function updateReport() {
  $("reportNew").hidden = pickedName !== NEW_NAME;
  const n = reportName(), S = SETTINGS;
  if (reportKind === "class") {
    $("reportMine").innerHTML = "";
    const a = $("classFrom").value, b = $("classTo").value;
    if (a && (!b || b < a)) $("classTo").value = a;
    $("classTo").min = a;
    $("reportHint").textContent = a
      ? `${md(addDays(a, -S.exBefore))} 到 ${md($("classTo").value)} 都不用做${S.task}`
      : `填${S.exName}第一天和最後一天${S.exBefore ? `，前 ${S.exBefore} 天也會自動免` : ""}`;
    showReportList();
    return;
  }
  $("reportList").hidden = true;
  const d = nowDay();
  let hint = `這次回報算 ${md(d)}（${wkOf(d)}）的${S.task}，${md(addDays(d, 1))} ${cutLabel()} 前回報`;
  if (n && MODEL?.byName[n]?.days[d] === "ok") hint = `${n} 已經回報過 ${md(d)}（${wkOf(d)}）了 ✓`;
  $("reportHint").textContent = hint;
  showMine(n);
}

// 自己最近 7 天的真實狀況（不顯示免死次數抵掉的「抵」）
function showMine(n) {
  const m = MODEL && MODEL.members.find(x => x.name === n);
  if (!m) { $("reportMine").innerHTML = ""; return; }
  const sym = { ok: "✓", miss: "✗", late: "遲", free: "免", now: "…", na: "·", nodata: "?" };
  const days = Array.from({ length: 7 }, (_, i) => addDays(MODEL.current, i - 6));
  $("reportMine").innerHTML = `<p class="hint" style="margin-top:16px">${esc(n)} 最近 7 天</p><div class="mine">` +
    days.map(d => { const st = MODEL.status(m, d); return `<span><i class="c ${st}">${sym[st] || ""}</i><br>${md(d)}</span>`; }).join("") + "</div>";
}

// 這個月所有人的免除紀錄
function showReportList() {
  const ym = nowDay().slice(0, 7), days = monthDays(ym), S = SETTINGS, list = [], groups = new Map();
  for (const [n, a, b] of parseLines(S.exemptions)) {
    const st = normDate(a), en = normDate(b) || st;
    if (!st || en < days[0] || addDays(st, -S.exBefore) > days[days.length - 1]) continue;
    const k = `${st}|${en}`;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(esc(n));
  }
  for (const [k, ns] of [...groups].sort()) {
    const [st, en] = k.split("|");
    list.push(`<b>${md(st)}～${md(en)}</b><span class="hint">${esc(S.task)} ${md(addDays(st, -S.exBefore))}～${md(en)} 免：</span>${ns.join("、")}`);
  }
  $("reportList").hidden = false;
  $("reportList").innerHTML = `<h2>${+ym.slice(5)} 月${esc(S.exName)}紀錄</h2>` +
    (list.length ? `<ul class="rlist">${list.map(x => `<li>${x}</li>`).join("")}</ul>` : `<p class="hint">目前沒有</p>`);
}

$("reportForm").onsubmit = async e => {
  e.preventDefault();
  const name = reportName(), S = SETTINGS;
  if (!name) return reportMsg("請選擇或輸入名字", "err");
  let body, done;
  if (reportKind === "class") {
    const from = $("classFrom").value, to = $("classTo").value || from;
    if (!from || to < from) return reportMsg(`請填${S.exName}第一天和最後一天`, "err");
    body = { type: "class", name, from, to };
    done = `${md(from)}～${md(to)} ${S.exName}已登記，${md(addDays(from, -S.exBefore))}～${md(to)} 免做${S.task}`;
  } else {
    const date = nowDay();
    body = { name, date };
    done = `${md(date)}（${wkOf(date)}）已完成`;
  }
  $("reportBtn").disabled = true;
  reportMsg("送出中…");
  try {
    const res = await fetch(API, { method: "POST", body: JSON.stringify({ g: G, ...body }) });
    const r = await res.json();
    if (!r.ok) throw new Error(r.error || "送出失敗");
    reportMsg(`✅ 收到了！${esc(name)} ${done}`, "ok");
    load();
  } catch (err) {
    reportMsg(`送出失敗：${esc(err.message)}，請再試一次`, "err");
  } finally {
    $("reportBtn").disabled = false;
  }
};

function secSettings() {
  const s = DATA.settings || {};
  const F = [
    ["名稱", "網站名稱", "text"], ["副標題", "副標題", "text"],
    ["任務名稱", "每天要做的事（例如：觀心書）", "text"], ["罰款名稱", "罰款叫什麼（例如：功德金）", "text"],
    ["開始計算日", "開始計算日", "date"], ["每次罰款", "每次缺交罰多少元", "number"],
    ["每月免死次數", "每人每月免死次數（0＝沒有）", "number"], ["免死從", "免死次數從哪個月開始（空白＝一開始就有）", "month"],
    ["切換時間", "每天的切換時間（例如中午 12:00）", "time"], ["免除名稱", "免除的名稱（例如：大堂課；空白＝不用這個功能）", "text"],
    ["免除提前天數", "免除從第一天的前幾天開始", "number"],
    ["保留月數", "資料保留幾個月（含這個月；空白＝全部保留，超過的回報會自動刪除）", "number"],
  ];
  const val = (k, t) => t === "date" ? normDate(s[k]) : t === "month" ? normMonth(s[k]) : (s[k] || "");
  $("adminSec").innerHTML = `<h2>基本設定</h2><div class="form-grid">` +
    F.map(([k, l, t]) => `<div class="field"><label>${l}</label><input data-k="${k}" type="${t}" value="${esc(val(k, t))}"></div>`).join("") +
    `<div class="field wide"><label>規則說明（一行一條，會顯示在「回報紀錄」上面）</label><textarea data-k="規則說明">${esc(s["規則說明"] || "")}</textarea></div></div>
    <div class="edit-actions"><button type="button" id="saveSettings">儲存</button></div><p class="hint msg" id="secMsg"></p>`;
  $("saveSettings").onclick = () => {
    const settings = {};
    $("adminSec").querySelectorAll("[data-k]").forEach(el => { settings[el.dataset.k] = el.value.trim(); });
    saving(() => api({ action: "saveSettings", settings }));
  };
}

// 通用表格編輯：一列一筆，可以新增、刪除、排序，按儲存整份寫回去
function editor({ title, hint, tab, cols, rows, newRow, reorder, beforeSave, groupBy, sortKey, locked }) {
  const fmt = (c, v) => c.type === "date" ? normDate(v) : c.type === "month" ? normMonth(v) : (v || "");
  $("adminSec").innerHTML = `<h2>${title}</h2>${hint ? `<p class="hint" style="margin-bottom:10px">${hint}</p>` : ""}
    <div class="scroll"><table class="edit"><thead><tr>${cols.map(c => `<th>${c.label}</th>`).join("")}<th></th></tr></thead><tbody></tbody></table></div>
    <div class="edit-actions"><button type="button" class="ghost" data-act="add">＋ 新增一列</button><button type="button" data-act="save">儲存</button></div>
    <p class="hint msg" id="secMsg"></p>`;
  const tb = $("adminSec").querySelector("tbody");
  // locked：平常只顯示，按「修改」才能改那一列（新增的一列直接可以改）
  const addRow = (r, editing) => {
    const tr = document.createElement("tr"), lock = locked && !editing;
    tr.innerHTML = cols.map((c, i) => `<td><input type="${c.type || "text"}" value="${esc(fmt(c, r[i]))}" ${c.list ? `list="${c.list}"` : ""} placeholder="${esc(c.ph || "")}" ${lock ? "disabled" : ""}></td>`).join("") +
      `<td class="row-act">${lock ? `<button type="button" class="ghost sm" data-act="edit">修改</button>` : ""}${reorder ? `<button type="button" class="ghost sm" data-act="up" title="上移">↑</button> <button type="button" class="ghost sm" data-act="down" title="下移">↓</button> ` : ""}<button type="button" class="ghost sm" data-act="del" title="刪除" ${lock ? "hidden" : ""}>✕</button></td>`;
    tb.appendChild(tr);
    return tr;
  };
  if (groupBy) {
    // 依月份分組，最新的月份在最上面
    let last = null;
    const sk = sortKey || groupBy;   // 越近的越上面
    (rows || []).map(r => ({ r, g: groupBy(r), s: sk(r) })).sort((a, b) => a.s < b.s ? 1 : a.s > b.s ? -1 : 0).forEach(({ r, g }) => {
      if (g !== last) {
        const h = document.createElement("tr");
        h.innerHTML = `<td colspan="${cols.length + 1}" style="padding-top:12px"><b>${g ? `${g.slice(0, 4)} 年 ${+g.slice(5)} 月` : "沒有日期"}</b></td>`;
        tb.appendChild(h);
        last = g;
      }
      addRow(r);
    });
  } else (rows || []).forEach(addRow);
  $("adminSec").onclick = e => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    const tr = b.closest("tr"), act = b.dataset.act;
    if (act === "add") {
      const nr = addRow(newRow ? newRow() : [], true);
      if (groupBy) tb.prepend(nr);   // 分組的表格：新的一列放最上面
      nr.querySelector("input").focus();
    }
    else if (act === "edit") {
      tr.querySelectorAll("input").forEach(i => i.disabled = false);
      tr.querySelector('[data-act="del"]').hidden = false;
      b.remove();
      tr.querySelector("input").focus();
    }
    else if (act === "del") tr.remove();
    else if (act === "up" && tr.previousElementSibling) tr.parentNode.insertBefore(tr, tr.previousElementSibling);
    else if (act === "down" && tr.nextElementSibling) tr.parentNode.insertBefore(tr.nextElementSibling, tr);
    else if (act === "save") {
      let data = [...tb.rows].map(r => [...r.querySelectorAll("input")].map(i => i.value.trim())).filter(r => r[0]);
      if (beforeSave) data = beforeSave(data);
      saving(() => api({ action: "saveTab", tab, rows: data }));
    }
  };
}
const nameCol = { label: "名字", list: "memberNames" };

// 回報管理：選一個人，看他這個月每一天的打卡明細（越近的越上面），可以刪除或補登
let admPick = "";
function secReports() {
  const ym = $("month").value, names = MODEL.members.map(m => m.name);
  $("adminSec").innerHTML = `<h2>每個人的打卡紀錄（${ym.replace("-", " 年 ")} 月）</h2>
    <p class="hint" style="margin-bottom:10px">選一個人看他每一天的狀況。打錯的回報可以刪除，缺交的日子可以補登（補登不算遲交）。要看別的月份，改上面的「月份」。</p>
    <div class="names" id="admNames">${names.map(n => `<button type="button" data-name="${esc(n)}" aria-pressed="${n === admPick}">${esc(n)}</button>`).join("")}</div>
    <div id="admList" style="margin-top:14px"></div>
    <p class="hint msg" id="secMsg"></p>`;
  const S = SETTINGS;
  const label = { ok: "✓ 已回報", miss: "✗ 缺交", late: "遲 遲交", free: `免 ${S.exName}`, now: "… 計算中", na: "· 不計算", nodata: "? 沒有資料" };
  const listFor = n => {
    const m = MODEL.members.find(x => x.name === n);
    if (!m) { $("admList").innerHTML = ""; return; }
    const t = monthDetail(m, ym);
    // 這個人這個月的每一筆回報，依「算哪一天」分好
    const byDay = {};
    for (const r of DATA["回報"] || []) {
      if (String(r[1]).replace(/\s*[（(].*$/, "").trim() !== n) continue;
      const ts = parseDateTime(r[0]);
      const day = normDate(r[2]) || (ts ? dayOf(ts.getTime()) : "");
      if (day.slice(0, 7) === ym) (byDay[day] ||= []).push(r);
    }
    const missAll = t.miss + t.cells.filter(c => c.was === "miss").length;
    const lateAll = t.late + t.cells.filter(c => c.was === "late").length;
    const cells = t.cells.filter(c => c.d <= MODEL.current || byDay[c.d] || c.st === "free").slice().reverse();
    $("admList").innerHTML = `<div class="stats" style="margin-bottom:12px">${[
        ["已回報", t.ok], ["缺交", missAll], ["遲交", lateAll], ["用免死抵掉", t.limit ? `${t.cov} / ${t.limit}` : "—"],
        S.exName ? [S.exName, t.free] : null, [`本月${S.fineName}`, `$${t.owe}${t.manual ? "（手算）" : ""}`],
      ].filter(Boolean).map(([k, v]) => `<div class="stat"><div class="k">${esc(k)}</div><div class="v" style="font-size:1.1rem">${v}</div></div>`).join("")}</div>
      <div class="scroll"><table class="edit"><tr><th>日期</th><th>狀態</th><th>送出時間</th><th></th></tr>${cells.map(c => {
        const st = c.st === "cov" ? c.was : c.st;
        const recs = byDay[c.d] || [];
        const status = `<i class="c ${c.st}">${{ ok: "✓", miss: "✗", late: "遲", cov: "抵", free: "免", now: "…", na: "·", nodata: "?" }[c.st]}</i> ${esc(label[st] || "")}${c.st === "cov" ? "（用免死抵掉）" : ""}`;
        const times = recs.length ? recs.map(r => `<div>${esc(r[0])}${r[3] && r[3] !== "已完成" ? `（${esc(r[3])}）` : ""}${r[1] !== n ? `（${esc(r[1])}）` : ""}
          <button type="button" class="ghost sm" data-del='${esc(JSON.stringify([r[0], r[1], r[2]]))}'>刪除</button></div>`).join("") : `<span class="hint">—</span>`;
        const canAdd = ["miss", "late", "cov", "nodata"].includes(c.st);   // 缺交、遲交的日子可以補登
        return `<tr><td>${md(c.d)}（${wkOf(c.d)}）</td><td>${status}</td><td style="white-space:normal">${times}</td>
          <td>${canAdd ? `<button type="button" class="ghost sm" data-add="${c.d}">補登</button>` : ""}</td></tr>`;
      }).join("")}</table></div>`;
  };
  if (admPick) listFor(admPick);
  $("admNames").onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    admPick = b.dataset.name;
    $("admNames").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    setMsg("secMsg", "");
    listFor(admPick);
  };
  $("admList").onclick = e => {
    const del = e.target.closest("[data-del]"), add = e.target.closest("[data-add]");
    if (del) {
      const [ts, name, date] = JSON.parse(del.dataset.del);
      if (!confirm(`確定刪除 ${name} ${ts} 這筆回報？`)) return;
      saving(() => api({ action: "deleteReport", ts, name, date }), "已刪除");
    } else if (add) {
      const date = add.dataset.add;
      if (!confirm(`幫 ${admPick} 補登 ${md(date)}（${wkOf(date)}）？`)) return;
      saving(() => api({ action: "addReport", name: admPick, date }), `已補登 ${admPick} ${md(date)}`);
    }
  };
}

/* ---------- 分頁 ---------- */
function showTab(name) {
  if (!document.querySelector(`[data-panel="${name}"]`)) name = "report";
  document.querySelectorAll("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== name);
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === name));
  document.body.classList.toggle("on-report", name === "report");
  if (name === "admin") {
    document.querySelector('[data-panel="admin"]').prepend($("loginCard"));
    showLoginState();
  }
}
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { history.replaceState(null, "", "#" + b.dataset.tab); showTab(b.dataset.tab); });

// 瀏覽器會把網頁暫存最多 10 分鐘：打開時比對最新版，有更新就自動重新載入（每個版本只試一次）
(async () => {
  try {
    const url = location.pathname;
    const [cached, fresh] = await Promise.all([
      fetch(url, { cache: "force-cache" }).then(r => r.text()),
      fetch(url, { cache: "reload" }).then(r => r.text()),
    ]);
    if (cached === fresh) return;
    const mark = String(fresh.length);
    if (sessionStorage.getItem("reloadedFor") === mark) return;
    sessionStorage.setItem("reloadedFor", mark);
    location.reload();
  } catch (e) {}
})();
